    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #485c64" x="208.08" y="97.23456" transform="rotate(-0 208.08 97.23456)">Mapped input ≠ significant eQTL link or effector-gene assignment</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="128.101481" transform="rotate(-0 7.2 128.101481)">b  Distinct analysis populations</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(35.417813 161.545348)">Conditional breadth comparison</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(27.666563 173.674957)">1652 genes → 1259 after masking</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(36.520313 185.804567)">≥4 versus 1–3 supporting traits</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(265.104113 161.545348)">Selected input audit</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(234.446456 173.674957)">283 genes · 1465 support events</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(246.39255 185.804567)">3224 within-gene trait pairs</text>
   </g>
   <g id="text_9">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #485c64" x="208.08" y="216.2088" transform="rotate(-0 208.08 216.2088)">HCC association is assessed separately in European and East Asian data</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start" x="7.2" y="247.075721" transform="rotate(-0 7.2 247.075721)">c  Seed-gene-body membership mask (Rule A)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(16.832109 274.088548)">Exclude the entire gene if its TSS OR any frozen mapped input overlaps a seed body.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(66.202031 286.218157)">Retain the existing support flags, scores and global HCC ranks.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(25.588828 298.347767)">Compare populations; do not attribute the change to a causal input contribution.</text>
   </g>
