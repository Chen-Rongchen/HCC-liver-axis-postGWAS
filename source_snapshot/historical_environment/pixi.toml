[workspace]
authors = ["Rongchen Chen"]
channels = ["conda-forge", "bioconda"]
description = "Recurrent liver-trait support and HCC association: derived-input reproducibility"
name = "hcc-liver-axis-postgwas"
platforms = ["linux-64"]
readme = "README.md"
version = "2.0.0-rc1"

[dependencies]
python = "3.10.*"
pandas = "2.3.*"
numpy = "1.24.*"
scipy = "1.15.*"
statsmodels = "0.14.*"
matplotlib = "3.10.*"
openpyxl = "3.1.*"
python-docx = "1.2.*"
pyyaml = "6.0.*"
pillow = ">=10,<12"
cairosvg = ">=2.7,<3"
mpmath = ">=1.3,<2"
r-base = ">=4.0,<4.5"
r-coloc = "5.2.3.*"
r-susier = "0.14.2.*"
"r-data.table" = ">=1.14,<2"
r-optparse = ">=1.7,<2"
plink = ">=1.90b6.21,<2"
bcftools = ">=1.20,<2"
htslib = ">=1.20,<2"
pandoc = ">=3,<4"
poppler = ">=24,<27"

[tasks]
check = "python code/replay_models.py"
replay-models = "python code/replay_models.py --refit"
